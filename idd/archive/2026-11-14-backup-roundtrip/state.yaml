  "change": "backup-roundtrip",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "que todo este cableado y funcione",
    "kind": "bug",
    "summary": "Una copia exportada o una sincronización se reimporta siempre y conserva todos los datos",
    "acceptance": "Exportar e importar (o sincronizar) devuelve exactamente los mismos movimientos, incluido el vínculo de serie recurrente, los mismos textos sin escapar y el mismo número de perfiles; un recurrente clonado durante muchos meses sigue teniendo un identificador que el validador acepta, y las copias con identificadores largos ya existentes se importan"
  },
  "facts": {
    "open": [
      "Los textos que una importación o sincronización anterior ya dejó escapados (por ejemplo &amp; en un nombre), ¿se reparan (al importar copias antiguas y una vez en los datos guardados en el dispositivo) o solo se deja de corromper a partir de ahora?"
    ]
  },
  "plan": {
    "paths": [
      "docs/api/backup-format.md",
      "src/__tests__/backupRoundtrip.test.ts",
