  "impacts": [
    {
      "kind": "adr",
      "id": "0002",
      "impact": "conforms",
      "reason": "La lógica nueva (ensurePeriodsForTransactions, recordSkippedRecurring, updateSkippedRecurring, el ancla del motor y la proyección por series) son funciones puras en src/utils y src/services/financeService sin entrada ni salida; el contexto y los hooks solo las llaman"
    },
    {
      "kind": "adr",
      "id": "0003",
      "impact": "conforms",
      "reason": "No añade escritores: los meses creados y las instancias saltadas pasan por el mismo estado y los mismos efectos de guardado de periodos y movimientos; la escritura por entidad sigue planificada en H6"
    },
    {
      "kind": "adr",
      "id": "0004",
      "impact": "conforms",
      "reason": "El cálculo hacia atrás usa Big como el resto del motor y sigue habiendo un solo motor de saldos; editar «solo este» sigue sustituyendo el movimiento por uno nuevo y la copia guardada es inmutable"
    },
    {
      "kind": "adr",
      "id": "0005",
      "impact": "conforms",
      "reason": "El formato solo añade el campo opcional Period.skippedRecurring sin cambiar la versión 2; los periodos y copias anteriores se leen sin él, la lectura con migración normaliza sus instancias, y hay prueba de ambos"
    },
    {
      "kind": "adr",
      "id": "0008",
      "impact": "conforms",
      "reason": "Las instancias saltadas se validan con el mismo esquema de movimiento al leer del disco (PeriodSchema con TransactionSchema) y al importar (validateTransactions); una inválida rechaza la copia entera"
    },
    {
      "kind": "adr",
      "id": "0009",
      "impact": "none",
      "reason": "Los periodos se cifran igual que antes con el campo nuevo dentro; no cambia qué se cifra ni cuándo"
    },
    {
      "kind": "scenario",
      "id": "confidencialidad",
      "impact": "none",
      "reason": "No cambia qué se cifra ni qué sale del dispositivo"
    },
    {
      "kind": "scenario",
      "id": "exactitud-contable",
      "impact": "conforms",
      "reason": "Los movimientos de cualquier mes cuentan, el saldo del mes configurado no cambia al añadir meses anteriores y la proyección deja de multiplicar los recurrentes por su historial"
    },
    {
      "kind": "scenario",
      "id": "integridad-datos",
      "impact": "conforms",
      "reason": "Un movimiento fuera de rango ya no queda guardado sin verse, y «solo este» ya no corta la serie al crear el mes siguiente ni tras recargar, restaurar o sincronizar"
    },
    {
      "kind": "scenario",
      "id": "modificabilidad",
      "impact": "conforms",
      "reason": "Reglas en funciones puras con pruebas; un único punto (efecto del contexto) crea los meses para todos los caminos que escriben movimientos"
    },
    {
      "kind": "scenario",
      "id": "rendimiento-historial",
      "impact": "conforms",
      "reason": "La reconciliación de meses es un recorrido lineal de los movimientos que no cambia nada si no falta ningún mes; el motor recorre los mismos meses y la proyección clona solo el último mes en vez de filtrar todo el historial"
    },
    {
      "kind": "scenario",
      "id": "usabilidad",
      "impact": "none",
      "reason": "Sin cambios de marcado, estilos ni textos"
    }
