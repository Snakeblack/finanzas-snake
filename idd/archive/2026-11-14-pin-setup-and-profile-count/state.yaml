                "severity": "WARNING",
                "summary": "src/hooks/useSecurity.ts:128-165 y src/components/App.tsx:1773-1782. Si handleSetupPassword falla tras escribir la sal y el check (líneas 130-134), el catch (162-165) solo muestra el error: la sal, el check y la clave en memoria quedan puestos, mientras hasPasswordSet sigue en false y isSettingUpPin en true. El nuevo botón «Cancelar» (handleCancelPinSetup, líneas 110-113) solo pone isSettingUpPin=false y no deshace nada. La app vuelve desbloqueada, con la cabecera en «Configurar PIN» y los guardados posteriores cifrados con la clave activa. En la siguiente recarga la sal hace que isLocked arranque en true y pide un PIN que la persona canceló creyendo que no existía. Antes de este cambio el camino no era alcanzable desde la UI, así que el estado a medias con Cancelar es nuevo. No es el fallo de escritura parcial entre colecciones, que se da por conocido.",
                "acceptance_criteria": "Tras un handleSetupPassword fallido seguido de handleCancelPinSetup, el estado queda coherente de una de estas dos formas, comprobado con un test que fuerce el fallo de un save: (a) no queda sal ni check en localStorage y no hay clave activa, o (b) la UI refleja que hay PIN (hasPasswordSet=true y botón «Bloquear»). No debe haber sal persistida con hasPasswordSet=false en una sesión desbloqueada. La corrección no puede dejar colecciones cifradas ilegibles tras recargar."
              }
            ]
