  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "esta aplicación... la intención está, pero no funciona bien... que todo este cableado y funcione",
    "kind": "bug",
    "summary": "El PIN se puede activar desde la interfaz y el modo de un perfil sobrevive a recargar con PIN activo",
    "acceptance": "Sin PIN configurado, el botón de la cabecera abre la pantalla de configuración sin vaciar los datos en memoria; al confirmar un PIN válido los datos quedan cifrados y la aplicación sigue desbloqueada con los mismos datos; tras recargar y desbloquear con PIN activo, el número de perfiles guardado (1 o 2) se restaura y no se sobrescribe con 2"
  },
  "facts": {
    "open": [
      "En la pantalla de configuración del PIN, ¿debe haber un botón Cancelar que vuelva a la aplicación sin activar el cifrado?"
    ]
  },
