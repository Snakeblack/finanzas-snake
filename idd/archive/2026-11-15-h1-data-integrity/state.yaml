{
  "schema": "idd-state/v1",
  "change": "h1-data-integrity",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "H1 integridad de datos: «Configurar cuenta» conserva los periodos, cuentas y periodos se guardan en una sola operación atómica y el orden manual de movimientos se guarda",
    "acceptance": "(1) Con varios meses y recurrentes, guardar «Configurar cuenta» sin cambiar el mes de inicio deja los mismos periodos y movimientos y tras recargar no hay recurrentes duplicados; (2) guardar cuentas o periodos nunca vacía el almacén en un paso aparte: un fallo a mitad deja los datos anteriores; (3) tras reordenar a mano movimientos del mismo día y recargar, se ven en el orden elegido"
  },
  "facts": {
    "open": [
      "Si el nuevo mes de inicio es posterior al primer mes existente (incluido elegir «Mes en curso» con meses anteriores), ¿qué pasa con los meses anteriores y sus movimientos: (a) se rechaza el cambio con un aviso mientras haya meses anteriores, (b) se borran esos meses y sus movimientos tras confirmar, o (c) se quitan los meses y los movimientos quedan guardados sin contar?",
      "Si el nuevo mes de inicio es anterior al primero existente, ¿los meses que se añaden por delante quedan vacíos (sin clonar recurrentes hacia atrás)?",
      "Al mover el mes de inicio, ¿el saldo de apertura manual pasa al nuevo primer mes y el anterior primer mes deja de ser de apertura manual?",
      "¿El orden manual de movimientos debe viajar en la copia exportada y en la sincronización entre dispositivos, o es solo de este dispositivo?"
    ]
  },
  "plan": {
    "paths": [
      "docs/api/backup-format.md",
      "docs/roadmap.md",
      "setupTests.ts",
      "src/__tests__/FinanzasContext.test.tsx",
      "src/__tests__/h1DataIntegrity.test.ts",
      "src/__tests__/storageService.test.ts",
      "src/components/transactions/TransactionsTab.tsx",
      "src/context/FinanzasContext.tsx",
      "src/hooks/useFinancialSelectors.ts",
      "src/services/db/idbProvider.ts",
      "src/services/schema.ts",
      "src/services/storageService.ts",
      "src/types/index.ts",
      "src/utils/backupValidator.ts",
      "src/utils/dateUtils.ts",
      "src/utils/transactionOrder.ts"
    ],
    "work_units": 3,
    "decision": true,
    "operations": [],
    "decisions": [
      "«Configurar cuenta» rechaza con un aviso un mes de inicio posterior al primero existente; uno anterior añade meses vacíos y traslada la apertura manual (reconfigurePeriods, función pura en dateUtils)",
      "Cuentas y periodos se sustituyen en una sola transacción de IndexedDB (replaceAllEntities) que aborta si una escritura lanza; la escritura por entidad queda para H6",
      "El orden manual es un campo opcional sortIndex por movimiento, asignado a todos los del día al arrastrar; viaja en copia y sincronización sin cambiar la versión del formato porque solo añade",
      "El doble de IndexedDB de las pruebas restaura el almacén al abortar y rechaza valores no clonables, para poder probar la atomicidad"
    ]
  },
