      "opened_turn": 23,
      "answer": "todas las recomendadas: 1) sí, huella distinta por orden de aparición y la primera conserva la actual; 2) sí, el mismo archivo adjunto dos veces sigue marcándose duplicado; 3) emparejamiento uno a uno con lo guardado (primero huellas exactas, después heurísticas, traspasos por lado); 4) días hábiles lunes-viernes sin festivos, máximo 2; 5) sí, la prueba viernes→lunes pasa a emparejarse y se sustituye por un T+3 hábil real; 6) gana el más cercano en días hábiles, mutuo, y en empate no se empareja",
      "source": "user",
