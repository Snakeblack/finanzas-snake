{
  "schema": "idd-state/v1",
  "change": "h2-statement-import",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Importación de extractos: dos filas idénticas legítimas comparten huella y la segunda no se puede importar; un traspaso de viernes a lunes no se empareja porque la ventana cuenta días naturales y no desempata",
    "acceptance": "Un extracto con dos filas idénticas (misma fecha, importe, tipo, concepto y cuenta) importa ambas como movimientos distintos y reimportarlo no duplica ninguna; un gasto del viernes y un ingreso del lunes siguiente en otra cuenta, con indicios de traspaso, se emparejan como un único traspaso"
  },
  "facts": {
    "open": [
      "¿La segunda y siguientes filas idénticas de un mismo extracto reciben una huella distinta según su orden de aparición, conservando la primera la huella actual para que lo ya importado siga reconociéndose?",
      "¿Si el mismo archivo se adjunta dos veces en una misma importación, las filas del segundo adjunto siguen marcándose como duplicadas?",
      "Al comparar con lo ya guardado, ¿cada movimiento guardado cubre como mucho una fila importada (emparejamiento uno a uno), o se mantiene que un movimiento guardado marque como duplicadas todas las filas iguales?",
      "¿La ventana de emparejamiento de traspasos pasa a contar días hábiles (lunes a viernes, sin festivos) con el mismo máximo de 2, o se amplía la ventana en días naturales?",
      "La prueba actual «no correlaciona T+3» usa viernes 1 → lunes 4 de mayo de 2026; ¿se acepta que pase a emparejarse y se sustituya por un T+3 hábil real?",
      "Con varios candidatos a pareja, ¿gana el más cercano en días hábiles (y debe serlo también en sentido inverso) y en empate se deja sin emparejar?"
    ]
  },
  "plan": {
    "paths": [
      "docs/roadmap.md",
      "src/__tests__/statementImportService.test.ts",
      "src/services/statementImportService.ts"
    ],
    "work_units": 1,
    "decision": true,
    "operations": [],
    "decisions": [
      "La primera aparición de una fila conserva la huella anterior y las filas idénticas siguientes del mismo adjunto añaden su orden (|#n) al origen de la huella: lo ya guardado se reconoce sin migrar datos",
      "detectDuplicates empareja uno a uno en dos pasadas: primero huella o correlación de traspaso, después traspaso manual y coincidencia exacta por concepto; un traspaso guardado se reclama por lado (origen y destino)",
      "El aviso de posible duplicado ignora los movimientos guardados que ya cubre otra fila del lote",
      "La ventana de traspasos cuenta días hábiles (lunes a viernes, sin festivos) en (fecha del gasto, fecha del ingreso], máximo 2; gana el candidato más cercano si lo es en ambos sentidos y en empate no se empareja; los candidatos ya emparejados no se excluyen para que el resultado no dependa del orden"
    ]
  },
