{
  "schema": "idd-state/v1",
  "change": "vercel-skip-docs-builds",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "debes ser eficiente con los actions, que se ejecuten solo cuando realmente se necesita",
    "kind": "refactor",
    "summary": "Saltar la construcción en Vercel cuando un push solo cambia documentación",
    "acceptance": "vercel.json declara un ignoreCommand que termina en 0 (construcción omitida) solo si existe un despliegue previo de la rama y nada fuera de docs/, idd/, openspec/ y archivos .md cambió desde él; en cualquier otro caso, incluido el primer push de una rama o un error de git, termina en 1 y se construye; se aplica también a main"
  },
  "facts": {
    "basis": "El usuario respondió 'todas las recomendadas' a las cuatro preguntas: rutas docs/**, idd/**, openspec/** y *.md; se aplica también a producción; el primer push de una rama siempre construye. Semántica de ignoreCommand y VERCEL_GIT_PREVIOUS_SHA verificada en la documentación de Vercel el 2026-11-14"
  },
  "plan": {
    "paths": [
      "vercel.json"
    ],
    "work_units": 1,
    "decision": true,
    "operations": [],
    "decisions": [
      "Comparar contra VERCEL_GIT_PREVIOUS_SHA y no contra HEAD^: un push de varios commits no se salta por error",
      "Cualquier fallo del comando (sin despliegue previo, SHA ausente del clon) termina en 1 y construye: ante la duda, se despliega"
    ]
  },
