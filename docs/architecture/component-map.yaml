  "divergences": [
    {
      "id": "ia-envia-datos-a-un-tercero",
      "summary": "La documentación afirma que ningún dato va a servidores, pero el asesor y la importación de PDF envían datos financieros al proveedor de IA. Resuelto por decisión: IA opcional y explícita (ADR 0007)",
      "documented": "docs/ARCHITECTURE.md:104",
      "evidence": [
        "src/services/geminiService.ts:199",
        "src/services/statementImportService.ts:932"
      ]
    },
    {
      "id": "sync-usa-intermediarios",
      "summary": "La documentación dice que la sincronización no tiene servidor intermediario, pero usa un servicio de contacto y retransmisores de terceros, con credenciales públicas fijas como alternativa",
      "documented": "docs/ARCHITECTURE.md:15",
      "evidence": [
        "src/services/syncService.ts:144",
        "src/services/syncService.ts:18"
      ]
    },
    {
      "id": "segundo-motor-de-saldos-sin-uso",
      "summary": "La documentación dice que dos motores derivan los saldos de las pestañas; uno de ellos solo lo usan las pruebas y, de usarse, daría saldos distintos (ignora cuotas de deuda y periodos)",
      "documented": "docs/ARCHITECTURE.md:72",
      "evidence": [
        "src/services/ledgerEngine.ts:16",
        "src/services/financeService.ts:21"
      ]
    },
    {
      "id": "saldos-en-coma-flotante",
      "summary": "La documentación fija el dinero como texto decimal exacto, pero el saldo inicial de cuenta y el de apertura de periodo son números de coma flotante",
      "documented": "docs/ARCHITECTURE.md:23",
      "evidence": [
        "src/types/index.ts:52",
        "src/types/index.ts:60"
      ]
    },
    {
      "id": "pin-inalcanzable-desde-la-interfaz",
      "summary": "La documentación ofrece cifrado opcional con PIN, pero el botón de configurarlo llama al bloqueo y el arranque lo revierte al no existir sal: un usuario nuevo no puede activar el cifrado",
      "documented": "README.md:10",
      "evidence": [
        "src/components/App.tsx:351",
        "src/hooks/useSecurity.ts:251"
      ]
    },
    {
      "id": "cambio-sdd-verificado-con-revision-pendiente",
      "summary": "El cambio de optimización de almacenamiento figura como verificado, pero su puerta de revisión sigue pendiente y dejó escrituras por entidad exportadas sin uso",
      "documented": "openspec/changes/optimize-storage-and-matching/state.yaml:2",
      "evidence": [
        "openspec/changes/optimize-storage-and-matching/state.yaml:9",
        "src/services/storageService.ts:839"
      ]
    },
    {
      "id": "interfaz-llama-a-adaptadores",
      "summary": "La interfaz importa almacenamiento, sincronización, IA e importación directamente en lugar de pasar por el estado de aplicación (contra ADR 0002)",
      "evidence": [
        "src/components/sync/SyncModal.tsx:7",
        "src/components/sync/SyncModal.tsx:4",
        "src/components/transactions/ImportStatementModal.tsx:17"
      ]
    },
    {
      "id": "esquemas-de-entidad-duplicados",
      "summary": "Existen dos esquemas del mismo movimiento; el de copias no reconoce el vínculo de serie recurrente y lo descarta al importar o sincronizar (contra ADR 0008)",
      "evidence": [
        "src/utils/backupValidator.ts:206",
        "src/services/schema.ts:8"
      ]
    },
    {
      "id": "escritura-en-dos-pasos",
      "summary": "Cuentas y periodos se guardan vaciando la colección y reescribiéndola en dos operaciones separadas; cerrar la pestaña entre ambas la deja vacía (contra ADR 0003)",
      "evidence": [
        "src/services/storageService.ts:472",
        "src/context/FinanzasContext.tsx:650"
      ]
    },
    {
      "id": "clave-de-sync-igual-al-identificador",
      "summary": "El identificador público de la sesión de sincronización y la clave de cifrado salen del mismo resumen del código: el servicio de contacto conoce la clave (contra ADR 0010)",
      "evidence": [
        "src/services/syncService.ts:76",
        "src/services/syncService.ts:84"
      ]
    },
    {
      "id": "secretos-en-direcciones-y-errores",
      "summary": "La clave del asesor viaja en la dirección de la llamada y la función de credenciales devuelve trazas y nombres de variables de entorno (contra ADR 0010)",
      "evidence": [
        "src/services/geminiService.ts:199",
        "api/get-turn-credentials.js:23"
      ]
    },
    {
      "id": "comprobacion-de-tipos-no-estricta",
      "summary": "El compilador no está en modo estricto, así que nulos y tipos implícitos no se detectan pese a que la comprobación de tipos pasa",
      "evidence": [
        "tsconfig.json:10"
      ]
    }
